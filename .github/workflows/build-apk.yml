name: Build Projeto Urbano APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "gradlew"
      - "settings.gradle"
      - "build.gradle"
      - "gradle/wrapper/gradle-wrapper.properties"

permissions:
  contents: read

concurrency:
  group: urbano-release-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
      - name: Install Android SDK and native toolchain
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;26.2.11394342" \
            "cmake;3.22.1"
      - name: Restore persistent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.URBANO_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.URBANO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.URBANO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.URBANO_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo 'Persistent signing key is not configured' >&2; exit 1)
          test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/urbano-release.p12"
          chmod 600 "$RUNNER_TEMP/urbano-release.p12"
          echo "URBANO_KEYSTORE_PATH=$RUNNER_TEMP/urbano-release.p12" >> "$GITHUB_ENV"
      - name: Set monotonic version code
        run: |
          echo "URBANO_VERSION_CODE=$((109 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "URBANO_VERSION_NAME=urbano-$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - name: Configure persistent signing and version
        run: python3 .github/workflows/configure-release.py
      - name: Build signed release APK
        env:
          URBANO_KEYSTORE_PASSWORD: ${{ secrets.URBANO_KEYSTORE_PASSWORD }}
          URBANO_KEY_ALIAS: ${{ secrets.URBANO_KEY_ALIAS }}
          URBANO_KEY_PASSWORD: ${{ secrets.URBANO_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: projeto-urbano-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90
