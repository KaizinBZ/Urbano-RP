name: Build Urbano Test APK
on:
  workflow_dispatch:
  push:
    branches: [urbanotest-build]
    paths:
      - 'urbanotest-build/BUILD_READY'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated test branch
        uses: actions/checkout@v4
      - name: Reassemble source archive
        run: cat urbanotest-build/parts/part-*.bin > /tmp/urbanotest-source.zip
      - name: Extract project
        run: python3 -c "import zipfile; z=zipfile.ZipFile('/tmp/urbanotest-source.zip'); bad=z.testzip(); assert bad is None, bad; z.extractall('project')"
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK, NDK and CMake
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.0.13004108' 'cmake;3.22.1'
      - name: Build debug APK
        working-directory: project
        run: chmod +x gradlew && ./gradlew --no-daemon --stacktrace :app:assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Urbano-Test-debug
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
